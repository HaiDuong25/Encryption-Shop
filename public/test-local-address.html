<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Test Local Vietnam Address API</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        select { margin: 10px; padding: 8px; min-width: 250px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-box { padding: 15px; border-radius: 5px; background: #f8f9fa; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇻🇳 Test 2-Level Vietnam Address API</h1>
        <div id="status" class="status info">Initializing...</div>
        
        <div class="stats">
            <div class="stat-box">
                <strong>Provinces</strong><br>
                <span id="provinceCount">0</span>
            </div>
            <div class="stat-box">
                <strong>Wards</strong><br>
                <span id="wardCount">0</span>
            </div>
        </div>

        <div class="form-group">
            <label>Province (Tỉnh/Thành phố):</label>
            <select id="provinceSelect" onchange="loadWards()">
                <option value="">-- Select Province --</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Ward (Xã/Phường/Thị trấn):</label>
            <select id="wardSelect">
                <option value="">-- Select Ward --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Full Address:</label>
            <div id="fullAddress" style="padding: 10px; background: #f8f9fa; border-radius: 5px; min-height: 20px;">
                Please select address...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function updateFullAddress() {
            const province = document.getElementById('provinceSelect').value;
            const ward = document.getElementById('wardSelect').value;
            
            const parts = [ward, province].filter(Boolean);
            const fullAddress = parts.length > 0 ? parts.join(', ') : 'Please select address...';
            
            document.getElementById('fullAddress').textContent = fullAddress;
        }

        async function loadProvinces() {
            try {
                updateStatus('🇻🇳 Loading provinces from local JSON API...', 'info');
                
                const response = await fetch(`${API_BASE}/provinces`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const provinces = await response.json();
                const select = document.getElementById('provinceSelect');
                
                select.innerHTML = '<option value="">-- Select Province --</option>';
                provinces.forEach(province => {
                    const option = document.createElement('option');
                    option.value = province;
                    option.textContent = province;
                    select.appendChild(option);
                });
                
                document.getElementById('provinceCount').textContent = provinces.length;
                updateStatus(`✅ Loaded ${provinces.length} provinces from Local JSON`, 'success');
                
            } catch (error) {
                updateStatus(`❌ Error loading provinces: ${error.message}`, 'error');
            }
        }

        async function loadWards() {
            const provinceName = document.getElementById('provinceSelect').value;
            const wardSelect = document.getElementById('wardSelect');
            
            // Reset ward select
            wardSelect.innerHTML = '<option value="">-- Select Ward --</option>';
            document.getElementById('wardCount').textContent = '0';
            
            if (!provinceName) {
                updateFullAddress();
                return;
            }
            
            try {
                updateStatus(`🏘️ Loading wards for ${provinceName}...`, 'info');
                
                const response = await fetch(`${API_BASE}/wards?province=${encodeURIComponent(provinceName)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const wards = await response.json();
                
                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward;
                    option.textContent = ward;
                    wardSelect.appendChild(option);
                });
                
                document.getElementById('wardCount').textContent = wards.length;
                updateStatus(`✅ Loaded ${wards.length} wards for ${provinceName}`, 'success');
                updateFullAddress();
                
            } catch (error) {
                updateStatus(`❌ Error loading wards: ${error.message}`, 'error');
            }
        }

        // Add event listener for ward selection
        document.getElementById('wardSelect').addEventListener('change', updateFullAddress);

        // Load provinces on page load
        window.onload = loadProvinces;
    </script>
</body>
</html>
